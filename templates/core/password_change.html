{% extends "base.html" %}
{% block title %}Changer mon mot de passe{% endblock %}
{% block content %}
<a href="{% url 'profile' %}" class="text-sm text-stone-500 hover:text-stone-700">← Mon profil</a>
<h1 class="text-2xl font-bold tracking-tight mt-2 mb-5">Changer mon mot de passe</h1>
<form method="post" class="bg-white rounded-2xl border border-stone-200/70 shadow-sm p-5 space-y-4">
  {% csrf_token %}
  {% for field in form %}
  <div>
    <label class="block text-sm font-medium mb-1.5">{{ field.label }}</label>
    {{ field }}
    {% for error in field.errors %}<p class="text-sm text-red-600 mt-1.5">{{ error }}</p>{% endfor %}
  </div>
  {% endfor %}
  <button class="w-full bg-emerald-700 hover:bg-emerald-800 transition text-white rounded-xl py-3.5 font-semibold shadow-sm shadow-emerald-900/20">Modifier</button>
</form>
<style>.helptext { display: none; }</style>
{% endblock %}
