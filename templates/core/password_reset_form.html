{% extends "auth_base.html" %}
{% block title %}Mot de passe oublié{% endblock %}
{% block content %}
<h1 class="text-3xl font-bold tracking-tight">Mot de passe oublié</h1>
<p class="text-stone-500 mt-2 mb-8">Saisissez votre email : nous vous enverrons un lien pour choisir un nouveau mot de passe.</p>
<form method="post" class="space-y-5">
  {% csrf_token %}
  <div class="field">
    <label class="block text-sm font-medium mb-1.5">Email</label>
    {{ form.email }}
  </div>
  <button class="w-full bg-emerald-700 hover:bg-emerald-800 transition text-white rounded-xl py-3.5 font-semibold shadow-sm shadow-emerald-900/20">Envoyer le lien</button>
</form>
<p class="text-sm text-stone-500 mt-7 text-center"><a href="{% url 'login' %}" class="text-emerald-700 font-semibold hover:underline">← Retour à la connexion</a></p>
{% endblock %}
